name: Build font

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-font.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build TTFs and preview
        run: |
          python src/generate_font.py \
            --base-font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --output-dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FonteCursiva-v0.2.3
          path: dist/
          if-no-files-found: error
